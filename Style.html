<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1f2933; --muted: #6b7785; --line: #e1e5ea;
    --nav: #1d2530; --nav-ink: #c9d1db; --accent: #0f766e; --accent-ink: #ffffff;
    --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --chip: #eef2f6;
    --s00: #37474f; --s01: #1565c0; --s02: #6a1b9a; --s03: #ad1457; --s04: #00838f;
    --s05: #ef6c00; --s06: #b88a00; --s07: #2e7d32; --s08: #4e342e; --s09: #c62828;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.45 "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); }
  #app { display: flex; height: 100vh; }
  #nav { width: 250px; flex: none; background: var(--nav); color: var(--nav-ink); overflow-y: auto; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 16px 18px; font-weight: 700; color: #fff; font-size: 15px; border-bottom: 1px solid #2c3644; }
  .logo { color: #5eead4; font-size: 20px; }
  .grp { padding: 10px 0 4px; }
  .grp > div { padding: 4px 18px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8794a5; display: flex; align-items: center; gap: 8px; }
  .grp > div i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .grp a { display: block; padding: 6px 18px 6px 34px; color: var(--nav-ink); text-decoration: none; cursor: pointer; font-size: 13.5px; }
  .grp a:hover { background: #263040; color: #fff; }
  .grp a.on { background: #0f766e33; color: #fff; border-left: 3px solid #5eead4; padding-left: 31px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #top { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top h1 { font-size: 17px; margin: 0; flex: 1; }
  #who { font-size: 12.5px; color: var(--muted); text-align: right; }
  #menuBtn { display: none; }
  #view { padding: 18px 20px 40px; overflow: auto; flex: 1; }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 22px; margin-top: 2px; }
  .kpi span { color: var(--muted); font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bar .grow { flex: 1; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: #b8c2cc; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--bad); border-color: #f1c4c4; }
  button.icon { border: none; background: none; font-size: 18px; padding: 2px 8px; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid #cfd6de; border-radius: 6px; background: #fff; width: 100%; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #99f6e4; border-color: var(--accent); }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { background: #f8fafb; text-align: left; font-weight: 600; font-size: 11.5px; color: #4a5562; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #f3fbfa; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .neg { color: var(--bad); } .pos { color: var(--ok); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--chip); font-size: 11.5px; white-space: nowrap; }
  .chip.ok { background: #dcfce7; color: #166534; } .chip.warn { background: #fef3c7; color: #92400e; } .chip.bad { background: #fee2e2; color: #991b1b; } .chip.info { background: #dbeafe; color: #1e40af; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 14px; }
  .fld label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
  .fld label .req { color: var(--bad); }
  .fld small { color: var(--muted); font-size: 11px; }
  .lines td { padding: 4px 6px; } .lines input, .lines select { padding: 4px 6px; font-size: 13px; }
  .lines td.ro { color: #334155; font-size: 12.5px; padding-top: 8px; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 6px 0 10px; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 16px; margin-bottom: 12px; }
  .kv div { font-size: 13px; } .kv span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; }
  #modal { position: fixed; inset: 0; background: #0f172a88; display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; z-index: 50; overflow: auto; }
  #modal .box { background: var(--panel); border-radius: 10px; width: min(1100px, 100%); box-shadow: 0 20px 50px #0004; }
  .mhead { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .mhead h2 { flex: 1; margin: 0; font-size: 16px; }
  #mbody { padding: 16px; }
  .hidden { display: none !important; }
  #toast { position: fixed; right: 18px; bottom: 18px; z-index: 80; display: flex; flex-direction: column; gap: 8px; }
  #toast div { background: #1f2933; color: #fff; padding: 10px 14px; border-radius: 8px; max-width: 420px; box-shadow: 0 6px 20px #0003; font-size: 13px; }
  #toast div.err { background: #991b1b; }
  #busy { position: fixed; inset: 0; background: #ffffff66; z-index: 90; display: flex; align-items: center; justify-content: center; }
  .spinner { width: 36px; height: 36px; border: 4px solid #cbd5e1; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stagebar { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0 12px; }
  .stagebar div { flex: 1; min-width: 90px; padding: 6px 8px; border-radius: 6px; font-size: 11.5px; background: #eef2f6; }
  .stagebar div.COMPLETED { background: #dcfce7; } .stagebar div.IN_PROGRESS { background: #dbeafe; } .stagebar div.MATERIAL_PENDING { background: #fef3c7; } .stagebar div.ON_HOLD { background: #fee2e2; }
  .stagebar b { display: block; font-size: 12px; }
  .muted { color: var(--muted); }
  body.auth #nav, body.auth #top { display: none; }
  body.auth #view { padding: 0; }
  .authwrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 12px; background: var(--nav); }
  .authcard { background: var(--panel); border-radius: 12px; padding: 26px 28px; width: min(460px, 100%); box-shadow: 0 20px 50px #0005; }
  .authcard h2 { margin: 6px 0 16px; font-size: 20px; }
  .authcard .fld { margin-bottom: 12px; }
  .authbrand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); }
  .authmsg { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .authalt { margin: 14px 0 4px; font-size: 13px; }
  button.wide { width: 100%; padding: 9px; margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  #who a { color: var(--accent); text-decoration: none; font-size: 12px; }
  @media (max-width: 860px) {
    #nav { position: fixed; z-index: 40; height: 100%; left: -260px; transition: left .2s; }
    body.navopen #nav { left: 0; }
    #menuBtn { display: inline-block; }
    #view { padding: 12px; }
  }
  @media print { #nav, #top, .bar, button { display: none !important; } }
</style>
